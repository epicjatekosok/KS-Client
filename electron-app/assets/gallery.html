<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Workshop Gallery</title><style>
*{box-sizing:border-box}body{margin:24px;background:#101218;color:#f1f3f8;font:15px/1.55 system-ui}h1,h2,p{margin:8px 0}small{color:#c4c7d0}button,input,select,summary{background:#21252d;color:inherit;border:1px solid #555d6a;border-radius:6px;padding:6px 9px;margin:3px}button,summary{cursor:pointer}button:hover{border-color:#f8ad39}article,details,aside{padding:12px;border-bottom:1px solid #4b453b}img{max-height:220px;max-width:100%;vertical-align:middle}#rows img{width:64px;height:42px;object-fit:contain}#status{color:#ffca78;min-height:1.5em}label{margin-right:8px}#detail:empty{display:none}audio{vertical-align:middle}
</style></head><body><h1>Workshop Gallery</h1><p>Import shared KS packs or drop an image or sound onto this window. Enable Resource Swapper in Settings and reload the game to apply changes.</p>
<label>Search <input id="query" type="search"></label><select id="category" aria-label="Category"><option>All</option><option>Images</option><option>Sounds</option><option>Fonts</option><option>Themes</option><option>CSS</option><option>Favorites</option></select>
<button id="themes">Manage themes</button><button id="styles">Manage CSS plugins</button><button id="weapons">Weapon Studio</button><button id="folder">Import folder</button><label>Import pack or file <input type="file" id="import" accept=".json,.png,.jpg,.jpeg,.webp,.gif,.mp3,.ogg,.wav"></label>
<p><label>Asset path for a single file <input id="target" list="paths" placeholder="audio/observed-file.ogg"></label><datalist id="paths"></datalist></p>
<p role="status" id="status"></p><aside id="detail"></aside><main id="rows"></main><button id="more" hidden>Show more files</button>
<script src="gallery.js"></script></body></html>
