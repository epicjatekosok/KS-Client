<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>KS Client • Betöltés</title>
<style>
:root{color-scheme:dark;--amber:#ff9d18;--bg:#0e0d0d;--panel:#1b1715;--line:#463225;--text:#f6f2ed;--muted:#aba097}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:var(--text)}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#ff9d181f,transparent 64%),linear-gradient(155deg,#171311,#0e0d0d)}
.shell{height:100%;width:100%;border:1px solid #6645277a;display:grid;place-items:center;position:relative;padding:18px}
.shell:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.card{position:relative;width:min(420px,100%);padding:28px 28px 22px;text-align:center;background:linear-gradient(155deg,#231b15,#151312);border:1px solid var(--line);border-radius:17px;box-shadow:0 22px 70px #0008,0 0 36px #ff9d1809}
.card:before{content:"";position:absolute;inset:13px auto 13px 0;width:3px;background:var(--amber);border-radius:5px}
.eyebrow{color:var(--amber);font-size:10px;font-weight:800;letter-spacing:2.3px;margin-bottom:14px}
.logo-wrap{width:92px;height:92px;display:grid;place-items:center;position:relative;margin:0 auto 14px}
.logo-wrap:before,.logo-wrap:after{content:"";position:absolute;inset:2px;border:2px solid transparent;border-top-color:var(--amber);border-left-color:#ff9d183b;border-radius:50%;animation:spin 2s linear infinite}
.logo-wrap:after{inset:10px;animation-direction:reverse;animation-duration:3.1s;border-top-color:#ffd18b}
.logo{max-width:58px;max-height:58px;object-fit:contain;filter:drop-shadow(0 0 11px #ff9d1844);animation:breathe 2.2s ease-in-out infinite}
.title{font-size:23px;letter-spacing:4px;font-weight:850}.title strong{color:var(--amber)}
.sub{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:650;margin-top:9px}
.track{height:6px;width:100%;background:#362821;border-radius:10px;overflow:hidden;margin-top:25px;border:1px solid #65442750}
.track .moving{height:100%;width:31%;background:linear-gradient(90deg,#b86a0e,var(--amber),#ffcf7e);border-radius:9px;animation:load 1.6s ease-in-out infinite}
.detail{font-size:11px;font-weight:700;letter-spacing:1.3px;margin-top:13px;color:var(--text)}
.helper{font-size:10px;margin-top:7px;color:var(--muted)}
.version{position:absolute;bottom:12px;right:15px;font-size:10px;letter-spacing:1.4px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{filter:drop-shadow(0 0 17px #ff9d1899);transform:scale(1.04)}}
@keyframes load{0%{transform:translateX(-110%)}55%{transform:translateX(175%)}100%{transform:translateX(350%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0s!important}}
</style></head><body>
<main class="shell" role="status" aria-label="KS Client betöltése">
  <section class="card">
    <div class="eyebrow">KS CLIENT • BETA</div>
    <div class="logo-wrap"><img class="logo" src="ks-logo.png" alt="KS Client logó"></div>
    <div class="title">KS <strong>CLIENT</strong></div>
    <div class="sub">KIRKA.IO GAME INTEGRATION</div>
    <div class="track" aria-hidden="true"><div class="moving"></div></div>
    <div class="detail">KLIENS BETÖLTÉSE</div>
    <div class="helper">Electron / CEF • Profilok és beállítások megtartva</div>
  </section>
  <span class="version">BETA 1.0.3</span>
</main></body></html>
