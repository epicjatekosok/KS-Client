name: KS Client - Windows verified engines

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified Windows release'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'electron-app/**'
      - 'launcher/**'
      - 'installer/**'
      - 'uninstaller/**'
      - 'ksui/**'
      - 'ci/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
      - 'LICENSE'
      - '*.md'
      - 'resources/**'
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
      - 'launcher/**'
      - 'installer/**'
      - 'uninstaller/**'
      - 'ksui/**'
      - 'tools/**'
      - 'ci/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
      - 'LICENSE'
      - '*.md'
      - 'resources/**'

permissions:
  contents: read

jobs:
  source-check:
    name: Source and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Cross-compile 1.0.31 Windows launcher and updater
        shell: bash
        run: |
          cd launcher
          GOOS=windows GOARCH=amd64 go build -trimpath -o ../KS-Client-Windows-Crosscheck.exe .
          test -s ../KS-Client-Windows-Crosscheck.exe
      - name: Electron source and release checks
        run: |
          node --check electron-app/main.cjs
          node --check electron-app/overlay/native_login_gate.js
          node --check electron-app/preload.cjs
          node --check electron-app/overlay/frame_pacer.js
          node --check electron-app/overlay/overlay.js
          node --check electron-app/overlay/game_extras.js
          node --check electron-app/overlay/workshop.js
          node --check electron-app/overlay/integration_bootstrap.js
          node --check electron-app/overlay/integration_core.js
          node --check electron-app/overlay/game_runtime.js
          node --check electron-app/overlay/render_telemetry.js
          node --check electron-app/overlay/webgl_cosmetics.js
          node --check electron-app/overlay/advanced_integration.js
          node --check electron-app/overlay/freeze_guard.js
          node --check electron-app/swapper.cjs
          node tests/test_kirka_stats.cjs
          node --check electron-app/overlay/kirka_stats.js
          node tests/test_workshop_128.cjs
          node tests/test_packs_125.cjs
          python ci/check_source.py
          python tests/test_ci_release_gates.py
          python tests/test_release_117.py
          python tests/test_release_118.py
          python tests/test_updates_119.py
          python tests/test_release_121.py
          python tests/test_release_122.py
          python tests/test_release_123.py
          python tests/test_beta_100.py
          python tests/test_release_120.py
      - name: Observe current public Kirka weapon asset availability
        run: python ci/check_live_weapon_assets.py
      - name: Test source archive verification
        run: python tests/test_public_source_103.py
      - name: Automated browser UI test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/test_overlay_112.py
          python tests/test_profile_116.py
          python tests/test_native_lists_117.py
          python tests/test_kirka_stats_ui.py
          python tests/test_driver_workshop_129.py
          python tests/test_lobby_styles_130.py
          python tests/test_features_128.py
          python tests/test_workshop_125.py
          python tests/test_menu_pacing_118.py
          python tests/test_game_integration_112.py
          python tests/test_advanced_114.py
          python tests/test_edge_smoothing.py
          python tests/test_runtime_integration.py
          python tests/test_loading_117.py
          python tests/test_runtime_116.py
          python tests/test_ui_118.py
          python tests/test_ui_120.py
          python tests/test_ui_121.py
          python tests/test_ui_122.py
          python tests/test_ui_123.py
          python tests/test_ui_beta_100.py
          python tests/test_auth_clickthrough_111.py
          python tests/test_auth_theme_101.py
          python tests/test_palette_103.py
          python tests/test_updates_103.py
          python tests/test_updates_107.py
          python tests/test_standalone_110.py
          python tests/test_english_104.py
          node tests/test_discord_activity_130.cjs
          node tests/test_discord_123.cjs
          node tests/test_auth_106.cjs
          node tests/test_native_login_111.cjs
          node tests/test_redline_navigation_112.cjs
          node tests/test_version_cef_links_113.cjs
          node tests/test_graphics_131.cjs
          node tests/test_beta_114.cjs

  offline-installer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build Electron and publish the verified Windows release
    needs: [source-check]
    permissions:
      contents: write
    runs-on: windows-2022
    defaults:
      run:
        working-directory: _verified_source
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the committed source archive and extract the Windows build inputs
        working-directory: .
        shell: pwsh
        run: |
          $archiveStore = Join-Path $env:RUNNER_TEMP 'ks-reviewed-source'
          $rebuild = Join-Path $env:GITHUB_WORKSPACE '_verified_source'
          ./ci/Package-Source.ps1 -OutputDirectory $archiveStore -RebuildDirectory $rebuild
          Copy-Item (Join-Path $archiveStore '*') -Destination $rebuild
      - name: Install icon resource generator dependency
        run: python -m pip install pillow
      - name: Fetch official Electron and verify its SHA256
        shell: pwsh
        env:
          KS_DISCORD_APPLICATION_ID: ${{ vars.KS_DISCORD_APPLICATION_ID }}
        run: ./ci/Prepare-Electron.ps1
      - name: Test native Gallery in the sandboxed Windows Electron runtime
        shell: pwsh
        run: ./ci/Test-GameResolution.ps1 -Test gallery
      - name: Measure actual WebGL output at fixed resolutions
        shell: pwsh
        run: ./ci/Test-GameResolution.ps1
      - name: Real Windows Electron startup smoke test
        shell: pwsh
        run: ./ci/Test-Engines.ps1 -Engine Electron
      - name: Build KS Client launcher and uninstaller
        shell: pwsh
        run: ./ci/Build-Native.ps1
      - name: Authenticode sign KS launcher and uninstaller when configured
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.KS_SIGNING_PFX_BASE64 || '' }}
          KS_SIGNING_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KS_SIGNING_PFX_PASSWORD || '' }}
        run: ./ci/Sign-Release.ps1 -Stage native
      - name: Validate launcher switch-token and updater version selection
        working-directory: _verified_source/launcher
        run: go test -timeout 5m -v .
      - name: Check native update command and JSON response
        shell: pwsh
        run: ./ci/Test-Updater.ps1
      - name: Start Electron with a legacy CEF selection and shortcut
        shell: pwsh
        run: ./ci/Test-Switching.ps1
      - name: Recheck Electron on the final runtime
        shell: pwsh
        run: ./ci/Test-Engines.ps1 -Engine Electron
      - name: Bundle the verified Electron runtime into a single OFFLINE payload
        run: python ci/package_offline.py
      - name: Test real installer extraction and in-place update code
        working-directory: _verified_source/installer
        run: go test -timeout 20m -v .
      - name: Compile offline setup embedding complete Electron payload
        shell: pwsh
        run: ./ci/Build-Setup.ps1
      - name: Sign the final standalone setup after its embedded ZIP is compiled
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.KS_SIGNING_PFX_BASE64 || '' }}
          KS_SIGNING_PFX_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KS_SIGNING_PFX_PASSWORD || '' }}
        run: ./ci/Sign-Release.ps1 -Stage setup
      - name: Validate final offline package and setup
        run: python ci/verify_offline.py
      - name: Audit authentic publisher signatures
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ github.event_name != 'pull_request' && secrets.KS_SIGNING_PFX_BASE64 || '' }}
        run: ./ci/Verify-Signing.ps1
      # Signed-status and checksum outputs (SIGNING-STATUS.txt, SHA256SUMS.txt,
      # RELEASE-MANIFEST.json) are generated locally and sent by Publish-Release.ps1.
      - name: Generate independently verifiable release SHA256 and source manifest
        run: python ci/make_release_manifest.py
      # No upload-artifact/download-artifact: GitHub Actions artifact storage is
      # full. The verified ZIP and EXE are published directly via Releases.
      - name: Publish verified ZIP and EXE directly to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KS_PUBLIC_RELEASE_TOKEN: ${{ secrets.KS_PUBLIC_RELEASE_TOKEN }}
        run: ./ci/Publish-Release.ps1
      # Maintainers can retrieve a tested candidate without publishing a tag,
      # consuming Actions artifact storage or notifying the client updater.
      - name: Stage requested maintainer test package as an unpublished draft
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.title, '[test package]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content RELEASE-MANIFEST.json -Raw | ConvertFrom-Json
          $files = @($manifest.files.name) + @('RELEASE-MANIFEST.json','SHA256SUMS.txt')
          $tag = "qa-$($manifest.version)-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "KS Client $($manifest.version) · Windows QA" --notes "Unpublished test package from workflow $env:GITHUB_RUN_ID. Public distribution requires separate approval."
          if ($LASTEXITCODE) { throw 'Could not stage the unpublished test package.' }
