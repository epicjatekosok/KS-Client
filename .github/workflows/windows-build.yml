name: KS Client - Windows verified engines

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'cef/**'
      - 'electron-app/**'
      - 'ci/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - 'cef/**'
      - 'electron-app/**'
      - 'launcher/**'
      - 'installer/**'
      - 'uninstaller/**'
      - 'ksui/**'
      - 'tools/**'
      - 'ci/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  source-check:
    name: Source and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax, identical engine overlays
        run: |
          node --check electron-app/main.cjs
          node --check electron-app/preload.cjs
          node --check electron-app/overlay/frame_pacer.js
          node --check electron-app/overlay/overlay.js
          node --check electron-app/overlay/game_extras.js
          node --check electron-app/overlay/workshop.js
          node --check electron-app/overlay/integration_bootstrap.js
          node --check electron-app/overlay/integration_core.js
          node --check electron-app/overlay/game_runtime.js
          node --check electron-app/overlay/render_telemetry.js
          node --check cef/overlay/integration_bootstrap.js
          node --check cef/overlay/integration_core.js
          node --check cef/overlay/game_runtime.js
          node --check cef/overlay/render_telemetry.js
          node --check electron-app/overlay/webgl_cosmetics.js
          node --check electron-app/overlay/advanced_integration.js
          node --check electron-app/overlay/freeze_guard.js
          node --check cef/overlay/webgl_cosmetics.js
          node --check cef/overlay/advanced_integration.js
          node --check cef/overlay/cef_input_probe.js
          node --check cef/overlay/freeze_guard.js
          node --check electron-app/swapper.cjs
          python ci/check_source.py
          python tests/test_ci_release_gates.py
          python tests/test_release_117.py
      - name: Automated browser UI test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/test_overlay_112.py
          python tests/test_game_integration_112.py
          python tests/test_advanced_114.py
          python tests/test_runtime_integration.py
          python tests/test_loading_117.py
          python tests/test_cef_input_117.py
          python tests/test_runtime_116.py

  electron:
    if: github.event_name != 'pull_request'
    name: Build and smoke test Electron
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Electron and verify its SHA256
        shell: pwsh
        run: ./ci/Prepare-Electron.ps1
      - name: Real Windows Electron startup smoke test
        shell: pwsh
        run: ./ci/Test-Engines.ps1 -Engine Electron
      - name: Upload verified Electron engine
        uses: actions/upload-artifact@v4
        with:
          name: verified-electron-runtime
          path: runtime/Electron/
          retention-days: 3
          if-no-files-found: error
      - name: Keep diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-failure-logs
          path: ~/AppData/Local/KSClient/*.log
          if-no-files-found: ignore

  cef:
    if: github.event_name != 'pull_request'
    name: Build and smoke test CEF
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish CefSharp and bundle app-local Desktop runtime
        shell: pwsh
        run: ./ci/Build-CEF.ps1
      - name: Authenticode sign KS CEF host when publisher certificate is configured
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ secrets.KS_SIGNING_PFX_BASE64 }}
          KS_SIGNING_PFX_PASSWORD: ${{ secrets.KS_SIGNING_PFX_PASSWORD }}
        run: ./ci/Sign-Release.ps1 -Stage cef
      - name: Real Windows CEF initialization smoke test
        shell: pwsh
        run: ./ci/Test-Engines.ps1 -Engine CEF
      - name: Verify real CEF JavaScript-to-native bridge
        shell: pwsh
        run: ./ci/Test-CEF-Bridge.ps1
      - name: Upload verified CEF engine
        uses: actions/upload-artifact@v4
        with:
          name: verified-cef-runtime
          path: runtime/CEF/
          retention-days: 3
          if-no-files-found: error
      - name: Keep CEF diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cef-failure-logs
          path: ~/AppData/Local/KSClient/*.log
          if-no-files-found: ignore

  offline-installer:
    if: github.event_name != 'pull_request'
    name: Package only after BOTH engine tests pass
    needs: [source-check, electron, cef]
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-electron-runtime
          path: runtime/Electron/
      - uses: actions/download-artifact@v4
        with:
          name: verified-cef-runtime
          path: runtime/CEF/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon resource generator dependency
        run: python -m pip install pillow
      - name: Build KS Client launcher and uninstaller
        shell: pwsh
        run: ./ci/Build-Native.ps1
      - name: Authenticode sign KS launcher and uninstaller when configured
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ secrets.KS_SIGNING_PFX_BASE64 }}
          KS_SIGNING_PFX_PASSWORD: ${{ secrets.KS_SIGNING_PFX_PASSWORD }}
        run: ./ci/Sign-Release.ps1 -Stage native
      - name: Validate engine switch-token handling
        working-directory: launcher
        run: go test -timeout 5m -v .
      - name: Recheck CEF renderer-to-native bridge after transfer
        shell: pwsh
        run: ./ci/Test-CEF-Bridge.ps1
      - name: Test native CEF to Electron and Electron to CEF switching
        shell: pwsh
        run: ./ci/Test-Switching.ps1
      - name: Recheck Electron after native CEF bridge and dual-engine switch tests
        shell: pwsh
        run: ./ci/Test-Engines.ps1 -Engine Electron
      - name: Bundle both VERIFIED runtimes into a single OFFLINE payload
        run: python ci/package_offline.py
      - name: Test real installer extraction and in-place update code
        working-directory: installer
        run: go test -timeout 20m -v .
      - name: Compile offline setup embedding complete dual-engine payload
        shell: pwsh
        run: ./ci/Build-Setup.ps1
      - name: Sign the final standalone setup after its embedded ZIP is compiled
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ secrets.KS_SIGNING_PFX_BASE64 }}
          KS_SIGNING_PFX_PASSWORD: ${{ secrets.KS_SIGNING_PFX_PASSWORD }}
        run: ./ci/Sign-Release.ps1 -Stage setup
      - name: Validate final offline package and setup
        run: python ci/verify_offline.py
      - name: Audit authentic first-party signatures and publish unsigned status honestly
        shell: pwsh
        env:
          KS_SIGNING_PFX_BASE64: ${{ secrets.KS_SIGNING_PFX_BASE64 }}
        run: ./ci/Verify-Signing.ps1
      - name: Generate independently verifiable release SHA256 and source manifest
        run: python ci/make_release_manifest.py
      - name: Upload candidate ONLY after all Windows checks succeed
        uses: actions/upload-artifact@v4
        with:
          name: KS-Client-alpha-1.1.17-Windows-CI-PASSED
          path: |
            KS-Client-alpha-1.1.17-Setup.exe
            KS-Client-alpha-1.1.17-Portable.zip
            CI-TEST-RESULT.txt
            SIGNING-STATUS.txt
            SHA256SUMS.txt
            RELEASE-MANIFEST.json
          retention-days: 14
          if-no-files-found: error
      - name: Publish direct standalone ZIP and EXE to official GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/Publish-Release.ps1
      - name: Keep diagnostics if installer verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-assembly-failure-logs
          path: ~/AppData/Local/KSClient/*.log
          if-no-files-found: ignore
